<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Study Notes</title>
<style>
  :root {
    --bg: #fafaf9;
    --fg: #1c1917;
    --muted: #78716c;
    --card: #ffffff;
    --border: #e7e5e4;
    --accent: #4f46e5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141413;
      --fg: #e7e5e4;
      --muted: #a8a29e;
      --card: #1f1e1d;
      --border: #3a3836;
      --accent: #818cf8;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
    line-height: 1.6;
  }
  main {
    max-width: 720px;
    margin: 0 auto;
    padding: 56px 20px 80px;
  }
  h1 { font-size: 1.9rem; margin: 0 0 6px; }
  .sub { color: var(--muted); margin: 0 0 36px; }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
  a.card {
    display: block;
    padding: 18px 20px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: inherit;
    text-decoration: none;
    transition: border-color .15s, transform .15s;
  }
  a.card:hover { border-color: var(--accent); transform: translateY(-1px); }
  .title { font-size: 1.1rem; font-weight: 600; margin: 0 0 4px; }
  .desc { color: var(--muted); font-size: .95rem; margin: 0; }
  .num { color: var(--accent); font-weight: 700; margin-right: 8px; }
  footer { margin-top: 40px; color: var(--muted); font-size: .85rem; }
</style>
</head>
<body>
<main>
  <h1>Study Notes</h1>
  <p class="sub">스터디 자료 모음</p>

  <ul>
    <li>

        <p class="desc">프로그램을 바꾸는 코드를 어떻게 믿을 수 있을까?</p>
      </a>
    </li>
    <li>
      <a class="card" href="refactor-arena-guide.html">
        <p class="title"><span class="num">02</span>Autoformalization → Lean Refactor Arena</p>
        <p class="desc">Decomposer · Formalizer · Prover 구조로 보는 Lean 리팩터 아레나 가이드</p>
      </a>
    </li>
  </ul>

  <footer>자료가 추가되면 위 목록에 &lt;li&gt; 블록을 복사해서 이어 붙이면 돼요.</footer>
</main>
</body>
</html>
